# Documentation site. Build with `uv run --group docs zensical build`; preview with `zensical serve`.
[project]
site_name = "Uniondeb"
site_description = "Agentic conduct-assurance platform: what it does, how it is built and how to run it"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Overview" = "index.md" },
  { "How it works" = "how-it-works.md" },
  { "Running it" = [
    { "Getting started" = "getting-started.md" },
    { "Test data" = "test-data.md" },
    { "Sending data directly" = "run-direct.md" },
    { "Sending data through the delivery harness" = "run-harness.md" },
    { "Review, scans and cases" = "review-and-cases.md" },
  ] },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "HTTP API" = "reference/api.md" },
    { "Configuration" = "reference/configuration.md" },
  ] },
  { "Governance and status" = "governance.md" },
  { "Operations" = [
    { "Runbooks" = "runbooks/README.md" },
    { "Audit chain verification failed" = "runbooks/audit-chain-failure.md" },
    { "Backup and restore" = "runbooks/backup-restore.md" },
    { "Incidents" = "runbooks/incidents.md" },
    { "Jobs" = "runbooks/jobs.md" },
    { "Key rotation" = "runbooks/key-rotation.md" },
    { "Security review" = "security-review.md" },
  ] },
  { "Development" = "development.md" },
  { "Design and decisions" = [
    { "Original design" = "design.md" },
    { "ADR 0001: record decisions" = "adr/0001-record-architecture-decisions.md" },
    { "ADR 0002: Relate agent extracts" = "adr/0002-relate-agent-extracts.md" },
    { "ADR 0003: one store, one process family" = "adr/0003-one-store-one-process-family.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
