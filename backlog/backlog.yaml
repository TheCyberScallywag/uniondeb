# Uniondeb backlog — single source of truth for GitHub issues, the project board and traceability.
#
# Every step has a stable ID (UND-NNN). The ID appears in:
#   issue title "[UND-NNN] …"  ·  branch "und-NNN-<slug>"  ·  commit trailer "Refs: UND-NNN"
#   PR body "Closes #<issue>"  ·  module docstrings "Implements: UND-NNN"  ·  TRACEABILITY.md
#
# scripts/bootstrap_backlog.py turns this file into issues (epics with sub-issues), adds them to
# GitHub Project https://github.com/users/TheCyberScallywag/projects/6 and records issue numbers
# in backlog/issue-map.json. Plan references point at docs/uniondeb-plan.md.

project:
  owner: TheCyberScallywag
  number: 6
  repo: TheCyberScallywag/uniondeb

epics:
  - {id: EPIC-0, title: "Phase 0 — Governance gate (before any real data)", plan: "§2", milestone: "P0 Governance"}
  - {id: EPIC-1, title: "Phase 1 — Foundations", plan: "§3, §4, §9", milestone: "P1 Foundations"}
  - {id: EPIC-2, title: "Phase 2 — Porthor: file ingest", plan: "§5.1", milestone: "P2 Porthor"}
  - {id: EPIC-2B, title: "Phase 2b — Cennad: journaled email stream", plan: "§5.2", milestone: "P2b Cennad"}
  - {id: EPIC-3, title: "Phase 3 — Echdynnwr: Relate extracts", plan: "§3.3, §3.4", milestone: "P3 Echdynnwr"}
  - {id: EPIC-4, title: "Phase 4 — Didolwr: clean / question / dirty", plan: "§5.3", milestone: "P4 Didolwr"}
  - {id: EPIC-5, title: "Phase 5 — Human review", plan: "§6", milestone: "P5 Review"}
  - {id: EPIC-6, title: "Phase 6 — Gwyliwr: security scans", plan: "§5.4", milestone: "P6 Gwyliwr"}
  - {id: EPIC-7, title: "Phase 7 — Ymchwiliad: investigation portal", plan: "§7", milestone: "P7 Ymchwiliad"}
  - {id: EPIC-8, title: "Phase 8 — Crynhoi and evaluation at scale", plan: "§5.5, §8", milestone: "P8 Evals"}
  - {id: EPIC-9, title: "Phase 9 — Hardening and pilot", plan: "§10", milestone: "P9 Pilot"}

steps:
  # ───────────────────────────── Phase 0: governance (people, not code) ─────────────
  - id: UND-001
    epic: EPIC-0
    title: DPIA and legitimate-interests assessment, with workers/members consulted
    type: governance
    priority: P0
    size: L
    plan: "§2 G1, G2, G7"
    owner: human
    summary: Complete a DPIA and LIA for monitoring communications; consult staff/members; publish a privacy notice.
    acceptance:
      - DPIA signed off by the data-protection lead, including risks of criminal-offence data (G4)
      - LIA recorded; consultation outcomes captured
      - Privacy notice published and staff/members informed before any real data is processed
  - id: UND-002
    epic: EPIC-0
    title: Adopt the code of ethics with stable clause ids
    type: governance
    priority: P0
    size: M
    plan: "§2 G5"
    owner: human
    summary: Replace config/code_of_ethics.DRAFT.md with the adopted code; clause ids CE1… are what "dirty" tags cite.
    acceptance:
      - Code adopted by CyberScallywags UK and committed under config/code_of_ethics.md
      - Clause ids are stable; changes are versioned
  - id: UND-003
    epic: EPIC-0
    title: Trigger list ownership and change control
    type: governance
    priority: P0
    size: S
    plan: "§2 G6"
    owner: human
    summary: Name an owner for the trigger list; changes by reviewed PR; every question-tag cites the list version.
    acceptance:
      - "Owner named"
      - "CODEOWNERS entry for config/triggers/"
      - "version scheme agreed"
  - id: UND-004
    epic: EPIC-0
    title: Scope decision — CyberScallywags-provided channels only; email exclusions (privileged and personal mail)
    type: governance
    priority: P0
    size: M
    plan: "§2 G3, G13; §11 D1, D17, D18"
    owner: human
    acceptance:
      - Written scope of channels and mailboxes in scope
      - Legal-adviser domain allowlist and personal-mail policy agreed
  - id: UND-005
    epic: EPIC-0
    title: Nominated officer, SAR procedure, escalation route and confidentiality rules
    type: governance
    priority: P0
    size: M
    plan: "§2 G9, G11, G12; §11 D11–D14"
    owner: human
    acceptance:
      - Nominated officer and deputy appointed (or decision recorded not to)
      - SAR / police / FCA escalation route approved by a legal adviser
      - Investigator conflict-of-interest rules agreed
  - id: UND-006
    epic: EPIC-0
    title: Retention schedule
    type: governance
    priority: P1
    size: S
    plan: "§2 G10; §11 D9"
    owner: human
    acceptance:
      - "Retention periods per data class agreed and recorded in config/retention.yaml"

  # ───────────────────────────── Phase 1: foundations ───────────────────────────────
  - id: UND-010
    epic: EPIC-1
    title: uv workspace, tooling and CI
    type: chore
    priority: P0
    size: M
    plan: "§9"
    summary: Python 3.14 uv workspace with packages/, ruff, pytest, pre-commit, GitHub Actions CI, ADR folder.
    acceptance:
      - "`uv sync` builds the workspace; `uv run pytest` and `uv run ruff check` pass"
      - CI runs lint and tests on every PR
      - docs/adr/0001-record-architecture-decisions.md exists
  - id: UND-011
    epic: EPIC-1
    title: "uniondeb-core: contracts, identifiers, alias resolution, schemas, email"
    type: feature
    priority: P0
    size: L
    plan: "§4, §5.1, §5.2"
    depends_on: [UND-010]
    summary: Port the tested Sgwrs contracts (devices, calls, messages, hand-offs, email), identifier validation, the alias layer and schema export.
    acceptance:
      - All Sgwrs contract and alias tests pass in the new package
      - JSON Schema / Table Schema / Parquet export via `uniondeb schemas export`
  - id: UND-012
    epic: EPIC-1
    title: "uniondeb-synth: synthetic traffic, scenarios, ground truth and email stream"
    type: feature
    priority: P0
    size: M
    plan: "§12"
    depends_on: [UND-011]
    acceptance:
      - "`uniondeb synth generate` writes normal / insider-dealing / drug-trafficking runs with ground truth"
      - Replay test: every valid row resolves, every injected fault fails
      - "`uniondeb synth stream` replays or generates journaled email as JSON"
  - id: UND-013
    epic: EPIC-1
    title: "uniondeb-store: Neo4j/Aura connection, migrations as code, dev stack"
    type: feature
    priority: P0
    size: M
    plan: "§4"
    depends_on: [UND-010]
    acceptance:
      - Settings for Aura (neo4j+s) and local Enterprise; async driver lifecycle
      - Ordered, idempotent Cypher migrations with a migration ledger in the database
      - deploy/compose.yml brings up Neo4j Enterprise for development
  - id: UND-014
    epic: EPIC-1
    title: Aura roles and privileges as code
    type: feature
    priority: P1
    size: M
    plan: "§4 Aura service accounts"
    depends_on: [UND-013]
    acceptance:
      - Role definitions (svc_ingest, svc_writeback, svc_extract_content, svc_extract_metrics, svc_review_api, svc_investigation, svc_sar, auditor, svc_retention) rendered to Cypher GRANT/DENY
      - Integration test against Neo4j Enterprise proves the metrics role cannot read content properties
  - id: UND-015
    epic: EPIC-1
    title: "Tarddiad: provenance library (PROV-O shaped)"
    type: feature
    priority: P0
    size: M
    plan: "§3.1 principle 6; §4"
    depends_on: [UND-013]
    acceptance:
      - Activity context manager records used/generated entities, agent version, model, prompt and config versions, trace id
      - Lineage query returns the chain from any entity back to its source file hash
  - id: UND-016
    epic: EPIC-1
    title: Logfire instrumentation baseline
    type: chore
    priority: P1
    size: S
    plan: "§8"
    depends_on: [UND-010]
    acceptance:
      - "Logfire configured once per service"
      - "send only if a token is present"
      - "trace id available to provenance"
  - id: UND-017
    epic: EPIC-1
    title: Load a synthetic run into the store with full provenance
    type: feature
    priority: P0
    size: M
    plan: "§4; §9 phase 1 acceptance"
    depends_on: [UND-012, UND-013, UND-015]
    acceptance:
      - "`uniondeb load <run>` writes SourceFiles, Records, Devices, Identifiers and an Ingest activity"
      - Synthetic runs go to a separate database, flagged synthetic

  # ───────────────────────────── Phase 2: Porthor ───────────────────────────────────
  - id: UND-020
    epic: EPIC-2
    title: Upload API with hashing, limits and dedupe
    type: feature
    priority: P0
    size: M
    plan: "§5.1"
    depends_on: [UND-015]
    acceptance:
      - "Multipart upload of jsonl/csv/parquet"
      - "size limits"
      - "sha256 dedupe"
      - "SourceFile + Upload activity recorded"
  - id: UND-021
    epic: EPIC-2
    title: Deterministic ingest pipeline (detect, resolve, validate, write)
    type: feature
    priority: P0
    size: L
    plan: "§5.1"
    depends_on: [UND-011, UND-020]
    acceptance:
      - "Format and dataset detection"
      - "alias resolution with ResolutionReport"
      - "validation"
      - "record writes; replay eval 100%"
  - id: UND-022
    epic: EPIC-2
    title: Ingest error capture to human review
    type: feature
    priority: P0
    size: M
    plan: "§5.1; §6"
    depends_on: [UND-021]
    acceptance:
      - "Every failing row becomes an IngestError + ReviewItem with raw row"
      - "error and report; zero silent drops"
  - id: UND-023
    epic: EPIC-2
    title: Mapping-proposal agent with human approval and a versioned alias registry
    type: feature
    priority: P1
    size: M
    plan: "§5.1"
    depends_on: [UND-022]
    acceptance:
      - "Pydantic AI agent proposes header mappings; approval required (deferred tool); approved mappings become alias registry vN+1 and the file is replayed"
  - id: UND-024
    epic: EPIC-2
    title: Job queue and worker
    type: feature
    priority: P1
    size: S
    plan: "§11 D6"
    depends_on: [UND-020]
    acceptance:
      - "Uploads processed asynchronously with retries; job status endpoint"

  # ───────────────────────────── Phase 2b: Cennad ───────────────────────────────────
  - id: UND-025
    epic: EPIC-2B
    title: Journal parsers (M365 envelope journal report, Google Workspace BCC copy)
    type: feature
    priority: P0
    size: M
    plan: "§5.2"
    depends_on: [UND-011]
    acceptance:
      - "Parse .eml into EmailEvent incl. envelope recipients (M365) and X-Gm-Original-To (GWS); attachment hashing"
  - id: UND-026
    epic: EPIC-2B
    title: SMTP receiver, raw .eml store and Kafka mail-journal publisher with DLQ
    type: feature
    priority: P1
    size: M
    plan: "§5.2"
    depends_on: [UND-025]
    acceptance:
      - "aiosmtpd receiver with TLS and sender allowlist; raw stored by hash; canonical JSON to mail-journal keyed by Message-ID; failures to mail-journal-dlq"
  - id: UND-027
    epic: EPIC-2B
    title: Porthor streaming consumer for mail-journal
    type: feature
    priority: P1
    size: S
    plan: "§5.2"
    depends_on: [UND-021, UND-026]
    acceptance:
      - "Idempotent by Message-ID; provenance per message; DLQ items become review items"

  # ───────────────────────────── Phase 3: Echdynnwr ─────────────────────────────────
  - id: UND-030
    epic: EPIC-3
    title: "Spike: Relate (relate-db) for per-agent extracts — ADR"
    type: spike
    priority: P0
    size: S
    plan: "§3.3; §11 D10"
    depends_on: [UND-013]
    acceptance:
      - "ADR records go/no-go on Aura subgraph pull"
      - "size limits"
      - "read-only mode"
      - "encryption at rest; fallback agreed"
  - id: UND-031
    epic: EPIC-3
    title: Extract contract registry (YAML, validated, hashed)
    type: feature
    priority: P0
    size: M
    plan: "§3.4"
    depends_on: [UND-010]
    acceptance:
      - "Contracts validated by Pydantic; hash recorded; forbidden-property lists enforced before an extract is built"
  - id: UND-032
    epic: EPIC-3
    title: Extract builder with TTL, provenance and fallback backend
    type: feature
    priority: P0
    size: L
    plan: "§3.3, §3.4"
    depends_on: [UND-030, UND-031, UND-015]
    acceptance:
      - "Builds read-only extracts per run; pseudonymises listed properties; Extract provenance; TTL reaper; agents can't see out-of-contract properties (test)"

  # ───────────────────────────── Phase 4: Didolwr ───────────────────────────────────
  - id: UND-040
    epic: EPIC-4
    title: Deterministic trigger tagger with a versioned trigger list
    type: feature
    priority: P0
    size: S
    plan: "§5.3 step 1"
    depends_on: [UND-011]
    acceptance:
      - "Whole-word"
      - "case-insensitive"
      - "Welsh + English; hits and list version recorded; 100% on fixtures"
  - id: UND-041
    epic: EPIC-4
    title: Ethics-judge agent with pseudonymised context and structured output
    type: feature
    priority: P0
    size: L
    plan: "§5.3 step 2"
    depends_on: [UND-040, UND-032]
    acceptance:
      - "EthicsJudgement {verdict, clauses, evidence_span, rationale, confidence}; content passed as data; dirty recall ≥ 0.95 on fixtures"
  - id: UND-042
    epic: EPIC-4
    title: Tag routing rules and append-only tag history
    type: feature
    priority: P0
    size: M
    plan: "§5.3 step 3; §4"
    depends_on: [UND-040]
    acceptance:
      - "Precedence dirty > question > clean; LLM can never downgrade a trigger hit; dirty → review; tags never overwritten"
  - id: UND-043
    epic: EPIC-4
    title: Adversarial fixtures (prompt injection, obfuscated triggers, Welsh coded language)
    type: feature
    priority: P1
    size: S
    plan: "§10 generator follow-ups"
    depends_on: [UND-012]
    acceptance:
      - "Generator emits labelled adversarial records; Didolwr eval includes them"

  # ───────────────────────────── Phase 5: review ────────────────────────────────────
  - id: UND-050
    epic: EPIC-5
    title: Review queues and decisions API with four-eyes control
    type: feature
    priority: P0
    size: M
    plan: "§6"
    depends_on: [UND-022, UND-042]
    acceptance:
      - "Queues per kind; decisions require rationale; dirty and alerts need two distinct reviewers; decisions recorded as provenance"
  - id: UND-051
    epic: EPIC-5
    title: Review console UI
    type: feature
    priority: P1
    size: M
    plan: "§6; §11 D7"
    depends_on: [UND-050]
    acceptance:
      - "Reviewers work queues end to end on synthetic data; no content in notifications"

  # ───────────────────────────── Phase 6: Gwyliwr ───────────────────────────────────
  - id: UND-060
    epic: EPIC-6
    title: Concern metrics per employee (activity-normalised, baselines)
    type: feature
    priority: P0
    size: M
    plan: "§5.4"
    depends_on: [UND-042]
    acceptance:
      - "Rates per 1,000 records"
      - "robust z-score vs own and team baseline; pseudonymised output; no content read"
  - id: UND-061
    epic: EPIC-6
    title: Graph signals (contact spikes, channel switching, burners, identifier churn, email exfiltration)
    type: feature
    priority: P0
    size: L
    plan: "§5.4; §5.2 email signals"
    depends_on: [UND-060]
    acceptance:
      - "Both synthetic scenario subjects ranked top-3; hidden links surfaced as hypotheses"
  - id: UND-062
    epic: EPIC-6
    title: Alerts, scheduler and dashboards API
    type: feature
    priority: P1
    size: M
    plan: "§5.4"
    depends_on: [UND-061, UND-050]
    acceptance:
      - "Scheduled scans; alerts to review; dashboard API restricted to compliance roles"

  # ───────────────────────────── Phase 7: Ymchwiliad ────────────────────────────────
  - id: UND-070
    epic: EPIC-7
    title: Cases, assignment with conflict checks, and logged identity reveal
    type: feature
    priority: P0
    size: M
    plan: "§7.1"
    depends_on: [UND-050]
    acceptance:
      - "Cases open only by escalation or nominated officer with reason; conflict rules enforced; reveal logged with reason"
  - id: UND-071
    epic: EPIC-7
    title: Hash-chained, append-only audit log (reads included)
    type: feature
    priority: P0
    size: M
    plan: "§7.4"
    depends_on: [UND-013]
    acceptance:
      - "Every audited action appends an event with prev-hash; verification detects tampering; no update/delete path"
  - id: UND-072
    epic: EPIC-7
    title: Flags vocabulary and investigator tags
    type: feature
    priority: P0
    size: S
    plan: "§7.3"
    depends_on: [UND-070, UND-071]
    acceptance:
      - "Controlled"
      - "versioned vocabulary; restricted flags invisible outside the case; legal hold blocks retention"
  - id: UND-073
    epic: EPIC-7
    title: "Holwr: case Q&A agent over the case extract"
    type: feature
    priority: P1
    size: M
    plan: "§7.2"
    depends_on: [UND-032, UND-070]
    acceptance:
      - "Answers cite record keys from the case extract only; read-only Cypher shown; questions audited"
  - id: UND-074
    epic: EPIC-7
    title: SAR mock adapter and nominated-officer approval flow
    type: feature
    priority: P0
    size: M
    plan: "§7.5"
    depends_on: [UND-070, UND-071]
    acceptance:
      - "SarPayload validated (UNKNOWN for unknowns, XX glossary codes, ≤ 8,000 chars reason); second-person approval; frozen payload hash + mock reference stored"
  - id: UND-075
    epic: EPIC-7
    title: Investigation portal UI
    type: feature
    priority: P1
    size: L
    plan: "§7.2"
    depends_on: [UND-072, UND-073, UND-074]
    acceptance:
      - "Both synthetic scenarios investigated end to end to a mock SAR reference; every screen audited"

  # ───────────────────────────── Phase 8: Crynhoi + evals ───────────────────────────
  - id: UND-080
    epic: EPIC-8
    title: "Crynhoi: case packs (no verdicts)"
    type: feature
    priority: P1
    size: M
    plan: "§5.5"
    depends_on: [UND-070]
    acceptance:
      - "Timeline"
      - "evidence spans"
      - "provenance and alternative explanations; never a recommendation"
  - id: UND-081
    epic: EPIC-8
    title: pydantic-evals suites and CI gate
    type: feature
    priority: P0
    size: M
    plan: "§8"
    depends_on: [UND-012]
    acceptance:
      - "Eval datasets from synthetic ground truth for each agent; regressions fail CI"
  - id: UND-082
    epic: EPIC-8
    title: Online evals, drift and fairness dashboards
    type: feature
    priority: P2
    size: M
    plan: "§8"
    depends_on: [UND-081, UND-050]
    acceptance:
      - "Reviewer decisions feed agreement metrics; concern rates by team and language monitored"

  # ───────────────────────────── Phase 9: hardening + pilot ─────────────────────────
  - id: UND-090
    epic: EPIC-9
    title: Retention and legal-hold jobs
    type: feature
    priority: P1
    size: S
    plan: "§2 G10; §7.3"
    depends_on: [UND-006, UND-072]
    acceptance:
      - "Content purged per schedule; legal hold respected; purges recorded as provenance"
  - id: UND-091
    epic: EPIC-9
    title: Security review and penetration test
    type: chore
    priority: P1
    size: M
    plan: "§10 phase 9"
    acceptance:
      - "Findings triaged; criticals fixed before pilot"
  - id: UND-092
    epic: EPIC-9
    title: Runbooks, backup and disaster recovery
    type: chore
    priority: P2
    size: M
    plan: "§10 phase 9"
    acceptance:
      - "Restore tested; runbooks for incidents"
      - "key rotation and audit-chain verification failures"
  - id: UND-093
    epic: EPIC-9
    title: Pilot on one CyberScallywags-provided channel
    type: governance
    priority: P1
    size: M
    plan: "§10 phase 9"
    owner: human
    depends_on: [UND-001, UND-002, UND-003, UND-004, UND-005]
    acceptance:
      - "Governance gate passed; pilot reviewed with stakeholders"
