<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniondeb delivery harness</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; }
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); }
  td.num { font-variant-numeric: tabular-nums; }
  .state { font-weight: 600; }
  .ingested, .duplicate { color: #2a8a4a; }
  .unreadable, .rejected, .failed, .undeliverable { color: #c0392b; }
  .wrap { overflow-x: auto; }
  code { font-size: 12px; }
</style>
</head>
<body>
<h1>Uniondeb delivery harness</h1>
<p id="health">Checking Uniondeb…</p>
<form id="send">
  <input type="file" name="files" multiple required accept=".jsonl,.csv,.parquet">
  <select name="dataset">
    <option value="">dataset: let Uniondeb detect</option>
    <option>calls</option><option>messages</option><option>handoff</option><option>email</option>
  </select>
  <input name="source_system" placeholder="source system (optional)">
  <button>Deliver</button>
  <span id="sent"></span>
</form>
<div class="wrap">
<table>
  <thead><tr><th>File</th><th>Source</th><th>Dataset</th><th>Bytes</th><th>State</th><th>Rows</th><th>Loaded</th><th>In review</th><th>Detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<script>
const key = new URLSearchParams(location.search).get("key");
const q = key ? "?key=" + encodeURIComponent(key) : "";
const rows = document.getElementById("rows"), seen = new Map();
const cell = (tr, text, cls) => { const td = tr.insertCell(); td.textContent = text ?? ""; if (cls) td.className = cls; };
function show(d) {
  let tr = seen.get(d.id);
  if (!tr) { tr = document.createElement("tr"); rows.prepend(tr); seen.set(d.id, tr); }
  tr.replaceChildren();
  const u = d.uniondeb || {};
  cell(tr, d.filename); cell(tr, d.source); cell(tr, u.dataset || d.dataset);
  cell(tr, d.bytes, "num"); cell(tr, d.state, "state " + d.state);
  cell(tr, u.rows ?? d.records, "num"); cell(tr, u.loaded, "num"); cell(tr, u.in_review, "num"); cell(tr, d.detail);
}
new EventSource("events" + q).addEventListener("delivery", e => show(JSON.parse(e.data)));
fetch("health").then(r => r.json()).then(h => {
  const u = h.uniondeb;
  document.getElementById("health").textContent = !u.reachable ? `Uniondeb at ${h.uniondeb_url} is not reachable (${u.error}).`
    : !u.authorised ? `Uniondeb at ${h.uniondeb_url} refused the harness token (${u.error}).`
    : `Delivering to ${h.uniondeb_url} as ${u.sub}.`;
});
document.getElementById("send").addEventListener("submit", async e => {
  e.preventDefault();
  const body = new FormData(e.target);
  for (const name of ["dataset", "source_system"]) if (!body.get(name)) body.delete(name);
  const r = await fetch("files" + q, { method: "POST", body });
  const out = await r.json();
  const refused = (out.refused || out.detail?.refused || []).map(x => `${x.filename}: ${x.reason}`).join("; ");
  document.getElementById("sent").textContent = `${(out.accepted || []).length} accepted` + (refused ? ` — refused: ${refused}` : "");
  e.target.reset();
});
</script>
</body>
</html>
