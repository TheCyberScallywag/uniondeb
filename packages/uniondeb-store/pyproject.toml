[project]
name = "uniondeb-store"
version = "0.1.0"
description = "Uniondeb store: Neo4j/AuraDB connection, Cypher runners and migrations as code"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "uniondeb-core",
    "neo4j>=6.4",
    "pydantic>=2.12",
]

[project.optional-dependencies]
relate = ["relate-db>=1.1"]

[project.entry-points."uniondeb.cli"]
store = "uniondeb.store.cli:register"

[tool.uv.sources]
uniondeb-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniondeb"]
