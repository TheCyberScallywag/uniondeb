[project]
name = "uniondeb-cases"
version = "0.1.0"
description = "Ymchwiliad domain: cases, flags vocabulary, hash-chained audit log, SAR adapter"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "uniondeb-core",
    "uniondeb-store",
    "pyyaml>=6",
    "pydantic>=2.12",
]

[project.entry-points."uniondeb.cli"]
audit = "uniondeb.cases.cli:register"

[tool.uv.sources]
uniondeb-core = { workspace = true }
uniondeb-store = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniondeb"]
