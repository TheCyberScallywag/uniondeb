[project]
name = "uniondeb-core"
version = "0.1.0"
description = "Uniondeb core: record contracts, identifiers, alias resolution and dataset schemas"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "pydantic>=2.12",
    "pyarrow>=22",
    "logfire>=5.6",
]

[project.scripts]
uniondeb = "uniondeb.core.cli:main"

[project.entry-points."uniondeb.cli"]
schemas = "uniondeb.core.export:register"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniondeb"]
