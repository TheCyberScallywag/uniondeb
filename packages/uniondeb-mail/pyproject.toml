[project]
name = "uniondeb-mail"
version = "0.1.0"
description = "Cennad: mail journal receiver, journal parsers and the mail-journal publisher"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "uniondeb-core",
    "aiosmtpd>=1.4.6",
    "pydantic>=2.12",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.12"]

[project.entry-points."uniondeb.cli"]
cennad = "uniondeb.mail.cli:register"

[tool.uv.sources]
uniondeb-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniondeb"]
