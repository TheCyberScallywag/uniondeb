[project]
name = "uniondeb-agents"
version = "0.1.0"
description = "Uniondeb agents: Porthor, Didolwr, Gwyliwr, Crynhoi and Holwr"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "uniondeb-core",
    "uniondeb-store",
    "uniondeb-extract",
    "uniondeb-cases",
    "pydantic-ai-slim>=2.71",
    "pyyaml>=6",
    "httpx>=0.28",
]

[tool.uv.sources]
uniondeb-core = { workspace = true }
uniondeb-store = { workspace = true }
uniondeb-extract = { workspace = true }
uniondeb-cases = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniondeb"]
