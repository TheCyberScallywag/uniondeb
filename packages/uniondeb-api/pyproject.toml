[project]
name = "uniondeb-api"
version = "0.1.0"
description = "Uniondeb API gateway, review console and investigation portal"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "uniondeb-core",
    "uniondeb-store",
    "uniondeb-extract",
    "uniondeb-agents",
    "uniondeb-cases",
    "uniondeb-worker",
    "fastapi>=0.165",
    "python-multipart>=0.0.34",
    "pyjwt[crypto]>=2.15",
    "jinja2>=3.1",
    "uvicorn>=0.54",
]

[project.entry-points."uniondeb.cli"]
api = "uniondeb.api.cli:register"

[tool.uv.sources]
uniondeb-core = { workspace = true }
uniondeb-store = { workspace = true }
uniondeb-extract = { workspace = true }
uniondeb-agents = { workspace = true }
uniondeb-cases = { workspace = true }
uniondeb-worker = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniondeb"]
